name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload the site as-is
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # 24 Nov 2026: on the Main Hub the deploy step looked for the bundle in the same
      # second it was uploaded and found nothing (three red deploys, tests green).
      # GitHub's list of bundles lags a moment behind the upload, so give it one.
      - name: Let the uploaded bundle show up
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
